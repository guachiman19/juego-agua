name: apply-v12
on:
  push:
    paths:
      - '.v12/patch.b64'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar splice verificando sha256
        run: |
          python3 - <<'PY'
          import base64, zlib, json, hashlib
          z = open('.v12/patch.b64').read().strip()
          ops = json.loads(zlib.decompress(base64.b64decode(z)).decode('utf-8'))
          old = open('index.html', encoding='utf-8').read()
          hin = hashlib.sha256(old.encode()).hexdigest()
          assert hin == 'c1067d7e15a7680f14578771a09be1e538a57241dcafc382af4a4fdd341e2b44', hin
          L = old.split('\n')
          for i1, i2, rep in reversed(ops):
              L[i1:i2] = rep
          new = '\n'.join(L)
          hout = hashlib.sha256(new.encode()).hexdigest()
          assert hout == '8979c3d3a27612d85896f6c86480b8e0b0014872d22a532df3e418b4e2553a1', hout
          open('index.html', 'w', encoding='utf-8').write(new)
          print('ok', hout, len(new.encode()), 'ops', len(ops))
          PY
      - name: Commit
        run: |
          rm -rf .v12
          git config user.name guachiman19
          git config user.email jaimedorado@gmail.com
          git add -A
          git commit -m "v12: canales diminutos de jardin y escenario Jardin japones completo" -m "Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_019QpBnFThqYdHk9fn48GPJa"
          git push
