name: apply-cm
on:
  push:
    paths:
      - '.cm/GO'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar splice a CLAUDE.md verificando sha256
        run: |
          cat .cm/c*.txt | tr -d '\n' > /tmp/s.b64
          python3 - <<'PY'
          import base64, zlib, json, hashlib
          p = json.loads(zlib.decompress(base64.b64decode(open('/tmp/s.b64').read().strip())).decode('utf-8'))
          old = open('CLAUDE.md', encoding='utf-8').read()
          hin = hashlib.sha256(old.encode()).hexdigest()
          assert hin == p['in'], ('entrada', hin)
          L = old.split('\n')
          for i1, i2, rep in reversed(p['ops']):
              L[i1:i2] = rep
          new = '\n'.join(L)
          hout = hashlib.sha256(new.encode()).hexdigest()
          assert hout == p['out'], ('salida', hout)
          open('CLAUDE.md', 'w', encoding='utf-8').write(new)
          print('ok', hout, len(new.encode()))
          PY
      - name: Commit
        run: |
          rm -rf .cm
          git config user.name guachiman19
          git config user.email jaimedorado@gmail.com
          git add -A
          git commit -m "docs: memoria v12 (canales diminutos, conservacion de masa, jardin japones)" -m "Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_019QpBnFThqYdHk9fn48GPJa"
          git push
