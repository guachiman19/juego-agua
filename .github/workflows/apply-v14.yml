name: aplicar-v14
on:
  push:
    branches: [upgrade-threejs]
    paths: ['.github/workflows/apply-v14.yml']
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade-threejs
      - name: Aplicar parche v14 (sha256 de entrada y salida)
        run: python3 .patch/apply.py
      - name: Commit y limpieza
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git rm -q -r .patch .github/workflows/apply-v14.yml
          git add -A
          git commit -q -m "v14: Three.js r186 (modulo ES), agua con mapa de normales, cascadas con vetas y bruma, luz fisica beta" -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01SjCdhUvYJ4PVo27c3Ygwpi"
          git push origin HEAD:upgrade-threejs
