<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Nacimiento · Juego de agua 3D</title>
<style>
 :root{--panel:rgba(10,18,28,.82);--acc:#4dd8ff;--tx:#e9f3fa}
 *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
 html,body{width:100%;height:100%;overflow:hidden;background:#0a1219;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--tx)}
 #c{display:block;width:100%;height:100%;touch-action:none}
 #panel{position:fixed;top:12px;left:12px;width:254px;max-height:calc(100% - 24px);overflow-y:auto;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:14px 14px 10px;z-index:20;transition:transform .35s ease;scrollbar-width:thin}
 #panel.off{transform:translateX(-285px)}
 #panel h1{font-size:19px;font-weight:600;letter-spacing:.3px}
 #panel .sub{font-size:11px;opacity:.65;margin:2px 0 8px}
 .sec{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;opacity:.55;margin:11px 0 6px}
 button{background:rgba(255,255,255,.07);color:var(--tx);border:1px solid rgba(255,255,255,.13);border-radius:9px;cursor:pointer;transition:all .15s;font-family:inherit}
 button:hover{background:rgba(255,255,255,.16)}
 button.sel{background:rgba(77,216,255,.18);border-color:var(--acc);box-shadow:0 0 10px rgba(77,216,255,.25)}
 .presets{display:flex;gap:6px}
 .presets button{flex:1;padding:7px 2px;font-size:11px}
 .tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
 .tools button{padding:6px 0 4px;font-size:17px;line-height:1.15;display:flex;flex-direction:column;align-items:center}
 .tools button span{font-size:8.5px;opacity:.75;margin-top:1px}
 .sl{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:11px}
 .sl label{width:72px;opacity:.85}
 .sl input{flex:1;accent-color:var(--acc);height:14px}
 .sl b{width:26px;text-align:right;font-weight:500;font-size:10px;opacity:.7}
 .tg{display:flex;align-items:center;gap:7px;margin:6px 0;font-size:12px;cursor:pointer}
 .tg input{accent-color:var(--acc);width:15px;height:15px;cursor:pointer}
 .btnrow{display:flex;gap:6px;margin-top:10px}
 .btnrow button{flex:1;padding:7px 2px;font-size:11px}
 .tips{font-size:10px;opacity:.5;margin-top:10px;line-height:1.5}
 #hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--panel);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);padding:7px 16px;border-radius:99px;font-size:12px;z-index:20;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
 #stats{position:fixed;top:12px;right:14px;text-align:right;font-size:11px;opacity:.8;z-index:20;background:var(--panel);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:6px 12px;line-height:1.6}
 #pbtn{position:fixed;top:12px;left:280px;z-index:21;width:34px;height:34px;border-radius:10px;font-size:15px;transition:left .35s ease}
 #pbtn.off{left:12px}
 @media(max-width:640px){#panel{width:214px}.tools{grid-template-columns:repeat(3,1fr)}#pbtn{left:240px}#pbtn.off{left:12px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
 <h1>💧 Nacimiento</h1>
 <div class="sub">Esculpe la montaña y guía el agua</div>
 <div class="sec">Escenarios</div>
 <div class="presets">
  <button data-p="montana" class="sel">⛰️ Montaña</button>
  <button data-p="valle">🏞️ Valle</button>
  <button data-p="jardin">🎋 Jardín</button>
 </div>
 <div class="sec">Herramientas</div>
 <div class="tools">
  <button data-t="mirar" class="sel">🖐️<span>Mirar</span></button>
  <button data-t="elevar">⛰️<span>Elevar</span></button>
  <button data-t="bajar">🕳️<span>Bajar</span></button>
  <button data-t="aplanar">🧱<span>Meseta</span></button>
  <button data-t="suavizar">🌀<span>Suavizar</span></button>
  <button data-t="fuente">💧<span>Manantial</span></button>
  <button data-t="roca">🪨<span>Roca</span></button>
  <button data-t="pino">🌲<span>Pino</span></button>
  <button data-t="cerezo">🌸<span>Cerezo</span></button>
  <button data-t="farol">🏮<span>Farol</span></button>
  <button data-t="borrar">🧹<span>Borrar</span></button>
 </div>
 <div class="sec">Ajustes</div>
 <div class="sl"><label>Pincel</label><input id="sBrush" type="range" min="4" max="34" step="1" value="14"/><b id="vBrush">14</b></div>
 <div class="sl"><label>Intensidad</label><input id="sStr" type="range" min="10" max="100" step="1" value="55"/><b id="vStr">55</b></div>
 <div class="sl"><label>Velocidad</label><input id="sSpeed" type="range" min="0" max="30" step="1" value="10"/><b id="vSpeed">1.0</b></div>
 <label class="tg"><input id="tEro" type="checkbox" checked/> Erosión del terreno</label>
 <label class="tg"><input id="tRain" type="checkbox"/> Lluvia</label>
 <label class="tg"><input id="tSnd" type="checkbox"/> Sonido de agua</label>
 <div class="btnrow">
  <button id="bReset">↺ Reiniciar</button>
  <button id="bDry">🏜️ Vaciar</button>
  <button id="bPause">⏸</button>
 </div>
 <div class="tips">🖱️ Izq: herramienta · Der: orbitar · Rueda: zoom · Shift: mover · Doble clic: acercar</div>
</div>
<button id="pbtn">☰</button>
<div id="hint">Elige una herramienta y esculpe. El agua encontrará su camino.</div>
<div id="stats"><span id="stFps">-- fps</span><br/><span id="stVol">agua: 0</span></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ================= NÚCLEO ================= */
const N=128, WORLD=220, CELL=WORLD/(N-1), CA=CELL*CELL, NN=N*N;
const terrain=new Float32Array(NN), water=new Float32Array(NN), sed=new Float32Array(NN), sedT=new Float32Array(NN);
const fL=new Float32Array(NN), fR=new Float32Array(NN), fT=new Float32Array(NN), fB=new Float32Array(NN);
const vX=new Float32Array(NN), vY=new Float32Array(NN), wet=new Float32Array(NN), spd=new Float32Array(NN), wTmp=new Float32Array(NN), wVis=new Float32Array(NN);
let sources=[], objects=[], currentPreset='montana', terrainDirty=false;
const P={tool:'mirar', brush:14, strength:0.55, speed:1, erosion:true, rain:false, sound:false, paused:false};
const idx=(i,j)=>j*N+i;
const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
/* ---- ruido ---- */
const frac=x=>x-Math.floor(x);
function hash2(x,y){return frac(Math.sin(x*127.1+y*311.7)*43758.5453)}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,o){o=o||4;let s=0,a=.5,f=1,n=0;for(let q=0;q<o;q++){s+=a*vnoise(x*f,y*f);n+=a;a*=.5;f*=2.03}return s/n}
const gauss=(u,v,cu,cv,sg)=>Math.exp(-((u-cu)*(u-cu)+(v-cv)*(v-cv))/sg);
/* ---- generación de terreno ---- */
function edgeFade(u,v){const e=Math.min(u,v,1-u,1-v);return e<0.07?e/0.07:1}
function genMontana(u,v){let h=1.6+5*fbm(u*3+7.3,v*3+2.1,4);h+=64*gauss(u,v,.5,.40,.045);h+=24*gauss(u,v,.30,.62,.03)+18*gauss(u,v,.68,.28,.025);h+=10*fbm(u*6+3.7,v*6+9.2,4)*clamp(h/34,0,1);h-=9*gauss(u,v,.72,.79,.018);h*=edgeFade(u,v);return Math.max(h,-2.5)}
function genValle(u,v){let h=2.4+3.5*fbm(u*3.4+1.2,v*3.4+5.5,4);h+=44*Math.exp(-Math.pow(u-.13,2)/.014)+44*Math.exp(-Math.pow(u-.87,2)/.014);h+=(1-v)*15;h+=6*fbm(u*7+2,v*7+4,3)*clamp(h/20,0,1);h-=7*gauss(u,v,.5,.86,.02);h*=edgeFade(u,v);return Math.max(h,-2.5)}
function genJardin(u,v){let h=3+1.15*fbm(u*5+3,v*5+8,4);h+=5.2*gauss(u,v,.3,.26,.011)+7*gauss(u,v,.72,.2,.013)+3.6*gauss(u,v,.18,.62,.009)+2.8*gauss(u,v,.82,.55,.008);h-=4*gauss(u,v,.55,.7,.02);h*=edgeFade(u,v);return Math.max(h,-2.2)}
function highestNear(cu,cv,r){let bi=2,bj=2,bh=-1e9;const ci=Math.round(cu*(N-1)),cj=Math.round(cv*(N-1));for(let j=Math.max(2,cj-r);j<=Math.min(N-3,cj+r);j++)for(let i=Math.max(2,ci-r);i<=Math.min(N-3,ci+r);i++){if(terrain[idx(i,j)]>bh){bh=terrain[idx(i,j)];bi=i;bj=j}}return{i:bi,j:bj}}
function rockBump(x,z,s){const ci=(x/WORLD+.5)*(N-1),cj=(z/WORLD+.5)*(N-1),r=1.6+1.8*s;
 for(let j=Math.max(1,Math.floor(cj-r));j<=Math.min(N-2,Math.ceil(cj+r));j++)for(let i=Math.max(1,Math.floor(ci-r));i<=Math.min(N-2,Math.ceil(ci+r));i++){const d=Math.hypot(i-ci,j-cj);if(d<r){const c=Math.cos(d/r*Math.PI/2);terrain[idx(i,j)]+=(0.6+0.8*s)*c*c}}}
function carveChannel(si,sj){
 let ci=si,cj=sj;
 for(let st=0;st<600;st++){
  for(let dj=-2;dj<=2;dj++)for(let di=-2;di<=2;di++){
   const ii=ci+di,jj=cj+dj;
   if(ii<1||jj<1||ii>N-2||jj>N-2)continue;
   const d=Math.hypot(di,dj);
   if(d<=2.2)terrain[idx(ii,jj)]-=1.15*Math.exp(-d*d/1.8);
  }
  let bi=ci,bj=cj,bh=terrain[idx(ci,cj)];
  for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){
   if(!di&&!dj)continue;
   const ii=ci+di,jj=cj+dj;
   if(ii<2||jj<2||ii>N-3||jj>N-3)continue;
   const h=terrain[idx(ii,jj)]+hash2(ii*1.3,jj*1.7)*.35;
   if(h<bh){bh=h;bi=ii;bj=jj}
  }
  if(bi===ci&&bj===cj)break;
  ci=bi;cj=bj;
  if(terrain[idx(ci,cj)]<2.2)break;
 }
}
function applyPreset(name){
 currentPreset=name;water.fill(0);sed.fill(0);sedT.fill(0);fL.fill(0);fR.fill(0);fT.fill(0);fB.fill(0);vX.fill(0);vY.fill(0);wet.fill(0);spd.fill(0);wTmp.fill(0);wVis.fill(0);
 sources=[];objects=[];
 const g=name==='valle'?genValle:(name==='jardin'?genJardin:genMontana);
 for(let j=0;j<N;j++)for(let i=0;i<N;i++)terrain[idx(i,j)]=g(i/(N-1),j/(N-1));
 if(name==='montana'){const s=highestNear(.5,.40,5);sources.push({i:s.i,j:s.j,rate:12});carveChannel(s.i,s.j);}
 else if(name==='valle'){const a=highestNear(.5,.08,6);sources.push({i:a.i,j:a.j,rate:10});carveChannel(a.i,a.j);const b=highestNear(.2,.18,5);sources.push({i:b.i,j:b.j,rate:5});carveChannel(b.i,b.j);}
 else{const a=highestNear(.72,.2,4);sources.push({i:a.i,j:a.j,rate:4});carveChannel(a.i,a.j);
  const pu=(u,v)=>({x:(u-.5)*WORLD,z:(v-.5)*WORLD});
  const deco=[['roca',.50,.63,1.3],['roca',.60,.74,1.1],['roca',.49,.77,.9],['roca',.63,.66,.8],['roca',.44,.70,1.0],['farol',.46,.64,1],['farol',.65,.77,1],['cerezo',.40,.74,1.1],['cerezo',.68,.60,1.3],['pino',.30,.30,1.2],['pino',.80,.34,1],['roca',.73,.24,.9],['roca',.70,.17,.7]];
  for(const d of deco){const p=pu(d[1],d[2]);objects.push({type:d[0],x:p.x,z:p.z,s:d[3],ry:hash2(d[1]*9,d[2]*7)*6.28})}
  for(const o of objects)if(o.type==='roca')rockBump(o.x,o.z,o.s*0.7);
 }
 P.erosion=name!=='jardin';const t=document.getElementById('tEro');if(t)t.checked=P.erosion;
 if(typeof onWorldRebuilt==='function')onWorldRebuilt();
}
/* ================= ESCENA 3D ================= */
let renderer,scene,camera,skyMesh,terrainMesh,waterMesh,foamPts,markerGroup,bottomMesh;
let inst={},walls=[];
let tPos,tCol,wPos,wCol,wAlp,fPos,fAlp;
const SUNDIR=new THREE.Vector3(.55,.75,.35).normalize();
const MAXFOAM=900;let foam=[];
function setupScene(){
 const cv=document.getElementById('c');
 renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 scene=new THREE.Scene();
 scene.fog=new THREE.FogExp2(0xa7c6de,0.0009);
 camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.5,2500);
 skyMesh=new THREE.Mesh(new THREE.SphereGeometry(1000,20,14),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,
  uniforms:{sunDir:{value:SUNDIR}},
  vertexShader:'varying vec3 vw;void main(){vw=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'varying vec3 vw;uniform vec3 sunDir;void main(){float h=max(vw.y,0.);vec3 c=mix(vec3(.80,.88,.95),vec3(.24,.51,.86),pow(h,.55));float s=pow(max(dot(vw,sunDir),0.),200.);c+=vec3(1.,.95,.8)*s;float s2=pow(max(dot(vw,sunDir),0.),8.)*.16;c+=vec3(1.,.9,.7)*s2;gl_FragColor=vec4(c,1.);}'}));
 scene.add(skyMesh);
 scene.add(new THREE.HemisphereLight(0xcfe6ff,0x4a5a3a,0.55));
 const sun=new THREE.DirectionalLight(0xfff1dc,1.05);
 sun.position.copy(SUNDIR).multiplyScalar(280);
 sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
 const sc=sun.shadow.camera;sc.left=-150;sc.right=150;sc.top=150;sc.bottom=-150;sc.near=20;sc.far=700;
 sun.shadow.bias=-0.0007;
 scene.add(sun);
 /* terreno */
 const tg=new THREE.PlaneGeometry(WORLD,WORLD,N-1,N-1);
 tPos=tg.attributes.position.array;
 for(let k=0;k<NN;k++){const i=k%N,j=(k/N)|0;tPos[k*3]=(i/(N-1)-.5)*WORLD;tPos[k*3+1]=0;tPos[k*3+2]=(j/(N-1)-.5)*WORLD}
 tCol=new Float32Array(NN*3);tg.setAttribute('color',new THREE.BufferAttribute(tCol,3));
 terrainMesh=new THREE.Mesh(tg,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.97,metalness:0}));
 terrainMesh.receiveShadow=true;terrainMesh.castShadow=true;
 scene.add(terrainMesh);
 /* agua */
 const wg=new THREE.PlaneGeometry(WORLD,WORLD,N-1,N-1);
 wPos=wg.attributes.position.array;
 for(let k=0;k<NN;k++){const i=k%N,j=(k/N)|0;wPos[k*3]=(i/(N-1)-.5)*WORLD;wPos[k*3+1]=-1;wPos[k*3+2]=(j/(N-1)-.5)*WORLD}
 wCol=new Float32Array(NN*3);wAlp=new Float32Array(NN);
 wg.setAttribute('aCol',new THREE.BufferAttribute(wCol,3));
 wg.setAttribute('aAlpha',new THREE.BufferAttribute(wAlp,1));
 waterMesh=new THREE.Mesh(wg,new THREE.ShaderMaterial({transparent:true,
  uniforms:{uT:{value:0},sunDir:{value:SUNDIR},fogC:{value:new THREE.Color(0xa7c6de)},fogD:{value:0.0009}},
  vertexShader:'attribute vec3 aCol;attribute float aAlpha;varying vec3 vN;varying vec3 vW;varying vec3 vC;varying float vA;\n'+
   'void main(){vN=normal;vC=aCol;vA=aAlpha;vec4 wp=modelMatrix*vec4(position,1.);vW=wp.xyz;gl_Position=projectionMatrix*viewMatrix*wp;}',
  fragmentShader:'uniform float uT;uniform vec3 sunDir;uniform vec3 fogC;uniform float fogD;varying vec3 vN;varying vec3 vW;varying vec3 vC;varying float vA;\n'+
   'void main(){vec3 n=normalize(vN);\n'+
   'n.xz+=0.045*vec2(sin(vW.x*1.9+uT*2.4)+sin(vW.z*3.1+uT*1.6),cos(vW.x*2.7+uT*1.9)+sin(vW.z*1.7+uT*2.2));n=normalize(n);\n'+
   'vec3 V=normalize(cameraPosition-vW);\n'+
   'float dif=0.5+0.5*max(dot(n,sunDir),0.);\n'+
   'vec3 col=vC*dif;\n'+
   'float fr=pow(1.-max(dot(n,V),0.),2.5);\n'+
   'col=mix(col,vec3(.62,.78,.92),fr*.6);\n'+
   'float sp=pow(max(dot(reflect(-sunDir,n),V),0.),70.)*.9;\n'+
   'col+=vec3(sp);\n'+
   'float d=length(cameraPosition-vW);\n'+
   'float fg=1.-exp(-fogD*fogD*d*d);\n'+
   'col=mix(col,fogC,fg);\n'+
   'float a=clamp(vA*(.6+.4*fr)+sp*.4,0.,.95);\n'+
   'gl_FragColor=vec4(col,a);}'}));
 waterMesh.renderOrder=2;scene.add(waterMesh);
 /* diorama: paredes y fondo */
 buildWalls();
 bottomMesh=new THREE.Mesh(new THREE.BoxGeometry(WORLD+.6,8,WORLD+.6),new THREE.MeshStandardMaterial({color:0x33241a,roughness:1}));
 bottomMesh.position.y=-9.5;scene.add(bottomMesh);
 /* espuma */
 const fg2=new THREE.BufferGeometry();
 fPos=new Float32Array(MAXFOAM*3);fAlp=new Float32Array(MAXFOAM);
 for(let q=0;q<MAXFOAM;q++)fPos[q*3+1]=-100;
 fg2.setAttribute('position',new THREE.BufferAttribute(fPos,3));
 fg2.setAttribute('aA',new THREE.BufferAttribute(fAlp,1));
 foamPts=new THREE.Points(fg2,new THREE.ShaderMaterial({transparent:true,depthWrite:false,
  vertexShader:'attribute float aA;varying float vA;void main(){vA=aA;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=clamp(170./max(-mv.z,1.),1.5,15.);gl_Position=projectionMatrix*mv;}',
  fragmentShader:'varying float vA;void main(){vec2 q=gl_PointCoord-.5;float r=length(q);float a=smoothstep(.5,.12,r)*vA;gl_FragColor=vec4(1.,1.,1.,a*.85);}'}));
 foamPts.renderOrder=3;scene.add(foamPts);
 markerGroup=new THREE.Group();scene.add(markerGroup);
 buildInstances();
}
function buildWalls(){
 const mat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:1,side:THREE.DoubleSide});
 for(let w=0;w<4;w++){
  const g=new THREE.PlaneGeometry(1,1,N-1,1);
  g.setAttribute('color',new THREE.BufferAttribute(new Float32Array(2*N*3),3));
  const m=new THREE.Mesh(g,mat);m.receiveShadow=true;
  walls.push(m);scene.add(m);
 }
 updateWalls();
}
function updateWalls(){
 for(let w=0;w<4;w++){
  const g=walls[w].geometry,p=g.attributes.position.array,c=g.attributes.color.array;
  for(let n=0;n<N;n++){
   let i,j;
   if(w===0){i=n;j=0}else if(w===1){i=N-1-n;j=N-1}else if(w===2){i=0;j=N-1-n}else{i=N-1;j=n}
   const x=(i/(N-1)-.5)*WORLD,z=(j/(N-1)-.5)*WORLD,h=terrain[idx(i,j)];
   p[n*3]=x;p[n*3+1]=h;p[n*3+2]=z;
   p[(N+n)*3]=x;p[(N+n)*3+1]=-5.6;p[(N+n)*3+2]=z;
   const t=clamp(h/40,0,1);
   c[n*3]=.42-.1*t;c[n*3+1]=.32-.08*t;c[n*3+2]=.22-.06*t;
   c[(N+n)*3]=.23;c[(N+n)*3+1]=.16;c[(N+n)*3+2]=.11;
  }
  g.attributes.position.needsUpdate=true;g.attributes.color.needsUpdate=true;g.computeVertexNormals();
 }
}
/* ---- colores del terreno ---- */
const C_G1=[.20,.42,.13],C_G2=[.38,.50,.20],C_RK=[.42,.40,.38],C_SN=[.92,.94,.96],C_SA=[.50,.43,.29],C_MO=[.25,.50,.22];
function updateTerrainColors(){
 for(let j=0;j<N;j++)for(let i=0;i<N;i++){const k=idx(i,j);
  const h=terrain[k];
  const hl=terrain[idx(Math.max(0,i-1),j)],hr=terrain[idx(Math.min(N-1,i+1),j)],ht=terrain[idx(i,Math.max(0,j-1))],hb=terrain[idx(i,Math.min(N-1,j+1))];
  const sl=Math.hypot(hr-hl,hb-ht)/(2*CELL);
  const vr=hash2(i*.7,j*.7)*.12;
  const base=currentPreset==='jardin'?C_MO:C_G1;
  const t=clamp(h/34,0,1);
  let r=base[0]+(C_G2[0]-base[0])*t+vr*.3,g=base[1]+(C_G2[1]-base[1])*t+vr*.4,b=base[2]+(C_G2[2]-base[2])*t;

  else if(P.tool==='bajar')terrain[k]-=26*st*f*dt;
  else if(P.tool==='aplanar')terrain[k]+=(avg-terrain[k])*Math.min(1,(4+6*st)*dt)*f;
  else if(P.tool==='suavizar'){const m=(terrain[k-1]+terrain[k+1]+terrain[k-N]+terrain[k+N])*.25;terrain[k]+=(m-terrain[k])*Math.min(1,(5+7*st)*dt)*f}
  terrain[k]=clamp(terrain[k],-6,95);
 }
 updateTerrainMesh();updateTerrainColors();rebuildObjects();rebuildMarkers();
}
/* ================= AUDIO ================= */
let actx=null,gnode=null;
function audioOn(){
 if(!actx){
  actx=new (window.AudioContext||window.webkitAudioContext)();
  const len=2*actx.sampleRate,buf=actx.createBuffer(1,len,actx.sampleRate),ch=buf.getChannelData(0);
  let last=0;
  for(let q=0;q<len;q++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;ch[q]=last*3.5}
  const src=actx.createBufferSource();src.buffer=buf;src.loop=true;
  const flt=actx.createBiquadFilter();flt.type='lowpass';flt.frequency.value=650;
  gnode=actx.createGain();gnode.gain.value=0;
  src.connect(flt);flt.connect(gnode);gnode.connect(actx.destination);src.start();
 }
 actx.resume();
}
function audioOff(){if(gnode&&actx)gnode.gain.setTargetAtTime(0,actx.currentTime,.2)}
/* ================= UI ================= */
const HINTS={mirar:'Arrastra para orbitar. Acércate con la rueda hasta ver los arroyos de cerca.',elevar:'Mantén pulsado sobre el terreno para levantar montañas.',bajar:'Excava valles y cauces para guiar el agua.',aplanar:'Crea mesetas y terrazas planas.',suavizar:'Redondea y pule el relieve.',fuente:'Clic para crear un manantial. Clic sobre uno existente para quitarlo.',roca:'Coloca rocas que desvían y dividen la corriente.',pino:'Planta pinos.',cerezo:'Planta cerezos en flor.',farol:'Coloca faroles de piedra para tu jardín zen.',borrar:'Arrastra para quitar objetos y manantiales.'};
function bindUI(){
 const $=id=>document.getElementById(id);
 document.querySelectorAll('.tools button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tools button').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel');P.tool=b.dataset.t;$('hint').textContent=HINTS[P.tool];
 }));
 document.querySelectorAll('.presets button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.presets button').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel');applyPreset(b.dataset.p);
  if(b.dataset.p==='jardin'){camG.rad=140;camG.ph=.8}else{camG.rad=230;camG.ph=1.02}
  camG.tx=0;camG.tz=0;camG.ty=14;
 }));
 $('sBrush').addEventListener('input',e=>{P.brush=+e.target.value;$('vBrush').textContent=e.target.value});
 $('sStr').addEventListener('input',e=>{P.strength=+e.target.value/100;$('vStr').textContent=e.target.value});
 $('sSpeed').addEventListener('input',e=>{P.speed=+e.target.value/10;$('vSpeed').textContent=P.speed.toFixed(1)});
 $('tEro').addEventListener('change',e=>P.erosion=e.target.checked);
 $('tRain').addEventListener('change',e=>P.rain=e.target.checked);
 $('tSnd').addEventListener('change',e=>{P.sound=e.target.checked;if(P.sound)audioOn();else audioOff()});
 $('bReset').addEventListener('click',()=>applyPreset(currentPreset));
 $('bDry').addEventListener('click',()=>{water.fill(0);fL.fill(0);fR.fill(0);fT.fill(0);fB.fill(0);sed.fill(0);spd.fill(0)});
 $('bPause').addEventListener('click',()=>{P.paused=!P.paused;$('bPause').textContent=P.paused?'▶':'⏸'});
 $('pbtn').addEventListener('click',()=>{$('panel').classList.toggle('off');$('pbtn').classList.toggle('off')});
 const cv=renderer.domElement;
 cv.addEventListener('pointerdown',onDown);
 window.addEventListener('pointermove',onMove);
 window.addEventListener('pointerup',onUp);
 cv.addEventListener('wheel',e=>{e.preventDefault();camG.rad=clamp(camG.rad*Math.exp(e.deltaY*.0011),7,340)},{passive:false});
 cv.addEventListener('contextmenu',e=>e.preventDefault());
 cv.addEventListener('dblclick',e=>{const p=hitTerrain(e);if(p){camG.tx=clamp(p.x,-130,130);camG.ty=p.y+2;camG.tz=clamp(p.z,-130,130);camG.rad=Math.max(24,camG.rad*.55)}});
 window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
}
/* ================= BUCLE ================= */
let lastT=performance.now(),fpsA=60,frame=0,uT=0;
function loop(){
 requestAnimationFrame(loop);
 const now=performance.now();
 let dtr=(now-lastT)/1000;lastT=now;dtr=Math.min(dtr,.05);
 fpsA=fpsA*.95+(1/Math.max(dtr,1e-3))*.05;
 uT+=dtr;
 const steps=P.paused?0:Math.round(2*P.speed);
 for(let q=0;q<steps;q++)simStep();
 applyBrush(dtr);
 if(terrainDirty&&frame%3===0){updateTerrainMesh();terrainDirty=false}
 updateWaterMesh();
 foamUpdate(dtr);
 if(frame%4===0)updateTerrainColors();
 if(frame%30===0){
  let vol=0,asp=0,c=0;
  for(let k=0;k<NN;k+=17){vol+=water[k];asp+=spd[k];c++}
  document.getElementById('stFps').textContent=fpsA.toFixed(0)+' fps';
  document.getElementById('stVol').textContent='agua: '+(vol*17*CA/1000).toFixed(1)+'k m³';
  if(P.sound&&gnode)gnode.gain.setTargetAtTime(Math.min(.2,(asp/Math.max(c,1))*.09),actx.currentTime,.3);
 }
 waterMesh.material.uniforms.uT.value=uT;
 camApply();
 renderer.render(scene,camera);
 frame++;
}
setupScene();
applyPreset('montana');
bindUI();
loop();
</script>
